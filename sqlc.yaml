version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/adapter/postgresrepo/queries"
    schema: "internal/adapter/postgresrepo/migrations"
    gen:
      go:
        package: "db"
        out: "internal/adapter/postgresrepo/db"
        emit_json_tags: false
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: false
        emit_result_struct_pointers: false
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "pg_catalog.varchar"
            go_type: "string"
          - db_type: "timestamptz"
            go_type: "time.Time"
